apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "trivy-operator-dashboard.fullname" . }}
  labels:
    {{- include "trivy-operator-dashboard.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      {{- include "trivy-operator-dashboard.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      {{- with .Values.podAnnotations }}
      annotations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      labels:
        {{- include "trivy-operator-dashboard.labels" . | nindent 8 }}
        {{- with .Values.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 6 }}
      {{- end }}
      serviceAccountName: {{ include "trivy-operator-dashboard.serviceAccountName" . }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      containers:
      - name: {{ .Chart.Name }}
        securityContext:
          {{- toYaml .Values.securityContext | nindent 10 }}
        image: "{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
        imagePullPolicy: {{ .Values.image.pullPolicy }}
        env:
        - name: MAINAPPPORT
          value: {{ .Values.service.port | quote }}
        - name: KUBERNETES__KUBECONFIGFILENAME
          value: {{ include "trivy-operator-dashboard.kubeConfigFullPath" . }}
        - name: KUBERNETES__USEDEFAULTCONTEXT
          value: {{ .Values.kubernetes.useDefaultContext | quote }}
        - name: KUBERNETES__NAMESPACELIST
          value: {{ .Values.kubernetes.namespaceList | quote }}
        - name: KUBERNETES__TRIVYUSECLUSTERCOMPLIANCEREPORT
          value: {{ .Values.kubernetes.trivyUseClusterComplianceReport | quote }}
        - name: KUBERNETES__TRIVYUSECLUSTERINFRAASSESSMENTREPORT
          value: {{ .Values.kubernetes.trivyUseClusterInfraAssessmentReport | quote }}
        - name: KUBERNETES__TRIVYUSECLUSTERRBACASSESSMENTREPORT
          value: {{ .Values.kubernetes.trivyUseClusterRbacAssessmentReport | quote }}
        - name: KUBERNETES__TRIVYUSECLUSTERSBOMREPORT
          value: {{ .Values.kubernetes.trivyUseClusterSbomReport | quote }}
        - name: KUBERNETES__TRIVYUSECLUSTERVULNERABILITYREPORT
          value: {{ .Values.kubernetes.trivyUseClusterVulnerabilityReport | quote }}
        - name: KUBERNETES__TRIVYUSECONFIGAUDITREPORT
          value: {{ .Values.kubernetes.trivyUseConfigAuditReport | quote }}
        - name: KUBERNETES__TRIVYUSEINFRAASSESSMENTREPORT
          value: {{ .Values.kubernetes.trivyUseInfraAssessmentReport | quote }}
        - name: KUBERNETES__TRIVYUSEEXPOSEDSECRETREPORT
          value: {{ .Values.kubernetes.trivyUseExposedSecretReport | quote }}
        - name: KUBERNETES__TRIVYUSERBACASSESSMENTREPORT
          value: {{ .Values.kubernetes.trivyUseRbacAssessmentReport | quote }}
        - name: KUBERNETES__TRIVYUSESBOMREPORT
          value: {{ .Values.kubernetes.trivyUseSbomReport | quote }}
        - name: KUBERNETES__TRIVYUSEVULNERABILITYREPORT
          value: {{ .Values.kubernetes.trivyUseVulnerabilityReport | quote }}
        - name: FILEREPOSITORY__BASEPATH
          value: {{ if include "trivy-operator-dashboard.fileRepositoryAllValuesSet" . }}{{ .Values.fileRepository.basePath | quote }}{{ else }}""{{ end }}
        {{- if include "trivy-operator-dashboard.fileRepositoryAllValuesSet" . }}
        - name: FILEREPOSITORY__CLUSTERCOMPLIANCEREPORTCRSUBPATH
          value: {{ .Values.fileRepository.clusterComplianceReportCrSubpath | quote }}
        - name: FILEREPOSITORY__CLUSTERINFRAASSESSMENTREPORTCRSUBPATH
          value: {{ .Values.fileRepository.clusterInfraAssessmentReportCrSubpath | quote }}
        - name: FILEREPOSITORY__CLUSTERRBACASSESSMENTREPORTCRSUBPATH
          value: {{ .Values.fileRepository.clusterRbacAssessmentReportCrSubpath | quote }}
        - name: FILEREPOSITORY__CLUSTERSBOMREPORTCRSUBPATH
          value: {{ .Values.fileRepository.clusterSbomReportCrSubpath | quote }}
        - name: FILEREPOSITORY__CLUSTERVULNERABILITYREPORTCRSUBPATH
          value: {{ .Values.fileRepository.clusterVulnerabilityReportCrSubpath | quote }}
        - name: FILEREPOSITORY__CONFIGAUDITREPORTCRSUBPATH
          value: {{ .Values.fileRepository.configAuditReportCrSubpath | quote }}
        - name: FILEREPOSITORY__EXPOSEDSECRETREPORTCRSUBPATH
          value: {{ .Values.fileRepository.exposedSecretReportCrSubpath | quote }}
        - name: FILEREPOSITORY__INFRAASSESSMENTREPORTCRSUBPATH
          value: {{ .Values.fileRepository.infraAssessmentReportCrSubpath | quote }}
        - name: FILEREPOSITORY__RBACASSESSMENTREPORTCRSUBPATH
          value: {{ .Values.fileRepository.rbacAssessmentReportCrSubpath | quote }}
        - name: FILEREPOSITORY__SBOMREPORTCRSUBPATH
          value: {{ .Values.fileRepository.sbomReportCrSubpath | quote }}
        - name: FILEREPOSITORY__VULNERABILITYREPORTCRSUBPATH
          value: {{ .Values.fileRepository.vulnerabilityReportCrSubpath | quote }}
        {{- end }}
        - name: GITHUB__SERVERCHECKFORUPDATES
          value: {{ .Values.gitHub.serverCheckForUpdates | quote }}
        - name: GITHUB__CHECKFORUPDATESINTERVALINMINUTES
          value: {{ .Values.gitHub.checkForUpdatesIntervalInMinutes | quote }}
        - name: OPENTELEMETRY__ENABLED
          value: {{ .Values.openTelemetry.enabled | quote }}
        - name: OPENTELEMETRY__OTELENDPOINT
          value: {{ .Values.openTelemetry.otelEndpoint | quote }}
        - name: OPENTELEMETRY__OTELPROTOCOL
          value: {{ .Values.openTelemetry.otelProtocol | quote }}
        - name: OPENTELEMETRY__CONSOLEENABLED
          value: {{ .Values.openTelemetry.consoleEnabled | quote }}
        - name: OPENTELEMETRY__ASPNETCOREINSTRUMENTATIONENABLED
          value: {{ .Values.openTelemetry.aspNetCoreInstrumentationEnabled | quote }}
        - name: OPENTELEMETRY__RUNTIMEINSTRUMENTATIONENABLED
          value: {{ .Values.openTelemetry.runtimeInstrumentationEnabled | quote }}
        - name: OPENTELEMETRY__PROMETHEUSEXPORTERPORT
          value: {{ .Values.openTelemetry.prometheusExporterPort | quote }}
        - name: SERILOG__MINIMUMLEVEL__DEFAULT
          value: {{ .Values.logging.level }}
        {{- range .Values.extraEnvValues }}
        - name: {{ .name }}
          value: {{ .value | quote }}
        {{- end }}
        ports:
        - name: http
          containerPort: {{ .Values.service.port }}
          protocol: TCP
        {{- if .Values.openTelemetry.prometheusExporterPort }}
        - name: metrics
          containerPort: {{ .Values.openTelemetry.prometheusExporterPort }}
          protocol: TCP
        {{- end }}
        volumeMounts:
        - mountPath: /tmp
          name: tmp-volume
        {{- if include "trivy-operator-dashboard.kubeConfigAllValuesSet" . }}
        - name: kubeconfig
          mountPath: {{ .Values.kubernetes.kubeConfigPath }}
          subPath: {{ .Values.kubernetes.kubeConfigFileName }}
        {{- end }}
        {{- if include "trivy-operator-dashboard.fileRepositoryAllValuesSet" . }}
        - name: file-repo 
          mountPath: {{ .Values.fileRepository.basePath }}
          # subPath: "." # required due to issue #7
        {{- end }}
        startupProbe:
          {{- toYaml .Values.startupProbe | nindent 10 }}
        livenessProbe:
          {{- toYaml .Values.livenessProbe | nindent 10 }}
        readinessProbe:
          {{- toYaml .Values.readinessProbe | nindent 10 }}
        resources:
          {{- toYaml .Values.resources | nindent 10 }}
      volumes:
      - name: tmp-volume
        emptyDir:
          sizeLimit: 1024Mi
      {{- if include "trivy-operator-dashboard.kubeConfigAllValuesSet" . }}
      - name: kubeconfig
        secret:
          secretName: {{ .Values.kubernetes.kubeConfigSecretName }}
          items:
          - key: {{ .Values.kubernetes.kubeConfigFileName }}
            path: {{ .Values.kubernetes.kubeConfigFileName }}
      {{- end }}
      {{- if include "trivy-operator-dashboard.fileRepositoryAllValuesSet" . }}
      - name: file-repo
        persistentVolumeClaim:
          claimName: {{ .Values.fileRepository.pvcName }} 
      {{- end }}
      
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
