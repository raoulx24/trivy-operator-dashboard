<p-splitter
  stateStorage="local"
  class="mb-8"
  [layout]="screenSize == 'sm' ? 'vertical' : 'horizontal'"
  [panelSizes]="[45, 55]"
  [stateKey]="screenSize !== 'sm' ? 'splitter.TrivyDependency' : undefined"
>
  <ng-template #panel>
    <div class="trivy-tree-table trivy-half overflow-auto">
      <p-treeTable
        columnResizeMode="expand"
        scrollHeight="flex"
        selectionMode="single"
        class="p-treetable-sm text-sm w-full"
        [resizableColumns]="true"
        [value]="treeNodes"
        [virtualScrollItemSize]="49"
        [(selection)]="selectedTreeNode"
        (onNodeSelect)="onTreeTableNodeSelect($event)"
        (onNodeUnselect)="onTreeTableNodeUnselect()"
      >
        <ng-template pTemplate="colgroup">
          <colgroup>
            <col style="width: auto" />
            <col style="width: auto" />
            <col style="width: 60px" />
            <col style="width: 60px" />
            <col style="width: 60px" />
            <col style="width: 60px" />
            <col style="width: 60px" />
            <col style="width: 120px" />
          </colgroup>
        </ng-template>
        <ng-template let-rowNode pTemplate="header">
          <tr class="sticky top-0 bg-white z-10">
            <th ttResizableColumn>Object Type</th>
            <th ttResizableColumn>Name</th>
            <th style="width: 60px" ttResizableColumn>C</th>
            <th style="width: 60px" ttResizableColumn>H</th>
            <th style="width: 60px" ttResizableColumn>M</th>
            <th style="width: 60px" ttResizableColumn>L</th>
            <th style="width: 60px" ttResizableColumn>U</th>
            <th style="width: 120px" ttResizableColumn></th>
          </tr>
        </ng-template>

        <ng-template let-rowData="rowData" let-rowNode pTemplate="body">
          <tr [ttRow]="rowNode" [ttSelectableRow]="rowNode">
            <td style="width: 250px">
              <p-treeTableToggler [rowNode]="rowNode"></p-treeTableToggler>
              {{ rowData.objectType }}
            </td>
            <td [attr.colspan]="rowData.hasSeverities ? 1 : 6">{{ rowData.description }}</td>
            @if (rowData.hasSeverities) {
              <td style="width: 60px">
                <p-tag
                  [rounded]="true"
                  [style]="0 | severityCssStyleById: rowData.critical ?? -1"
                  [value]="rowData.critical | vulnerabilityCount"
                />
              </td>
              <td style="width: 60px">
                <p-tag
                  [rounded]="true"
                  [style]="1 | severityCssStyleById: rowData.high ?? -1"
                  [value]="rowData.high | vulnerabilityCount"
                />
              </td>
              <td style="width: 60px">
                <p-tag
                  [rounded]="true"
                  [style]="2 | severityCssStyleById: rowData.medium ?? -1"
                  [value]="rowData.medium | vulnerabilityCount"
                />
              </td>
              <td style="width: 60px">
                <p-tag
                  [rounded]="true"
                  [style]="3 | severityCssStyleById: rowData.low ?? -1"
                  [value]="rowData.low | vulnerabilityCount"
                />
              </td>
              <td style="width: 60px">
                <p-tag
                  [rounded]="true"
                  [style]="4 | severityCssStyleById: rowData.unknown ?? -1"
                  [value]="rowData.unknown | vulnerabilityCount"
                />
              </td>
            }

            <td style="width: 100px">
              @if (rowData.isTrivyReport) {
                <p-button
                  label="Open... ⧉"
                  raised
                  size="small"
                  text
                  class="tod-text-primary-color"
                  (onClick)="onOpenTrivyReport(rowData)"
                />
              }
            </td>
          </tr>
        </ng-template>
      </p-treeTable>
    </div>
  </ng-template>
  <ng-template #panel>
    <div class="w-full">
      <app-fcose
        [extraColorClasses]="extraColorClasses"
        [fcoseClasses]="'fcose fcose-half mt-2'"
        [idealEdgeLength]="30"
        [nodeDataDtos]="nodeDataDtos"
        [selectedNodeId]="selectedNodeId"
        (selectedNodeIdChange)="onGraphSelectedNodeIdChange($event)"
      />
    </div>
  </ng-template>
</p-splitter>
