<p-dialog closable="true"
          closeOnEscape="true"
          dismissableMask="true"
          [header]="`Compare ${reportsName()}`"
          maximizable="true"
          resizable="true"
          [breakpoints]="{ '890px': '90vw' }"
          [contentStyle]="{ height: '95vh' }"
          [modal]="true"
          [style]="{ width: '90vw' }"
          [(visible)]="isVisible" >
  <app-generic-reports-compare [comparedTableColumns]="comparedTableColumns()"
                               [compareExtraClasses]="'trivy-with-filters'"
                               [compareIsResetFiltersVisible]="true"
                               [compareStateKey]="`${reportsName()} - Compared`"
                               [namespacePlaceholder]="'Select namespace'"
                               [imagePlaceholder]="'Select image'"
                               [dataDtos]="dataDtos()"
                               [firstSelectedTrivyReportId]="firstSelectedTrivyReportId()"
                               [secondSelectedTrivyReportId]="secondSelectedTrivyReportId()"
                               [namespacedImageDtos]="namespacedImageDtos()"
                               [firstSelectorLonger]="firstSelectorLonger()"
                               [walkingIsEnabled]="walkingIsEnabled()"/>
</p-dialog>
