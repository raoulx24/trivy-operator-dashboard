<div class="relative flex w-full items-center">
  @if (showLeftButton()) {
    <button class="absolute left-0 tod-scroll-btn hover:tod-scroll-btn py-1 px-4 rounded-full" (click)="scrollLeft()">
      <i class="pi pi-chevron-left text-sm"></i>
    </button>
  }

  <div #scrollContainer class="flex overflow-x-auto tod-scrollbar-hide space-x-4">
    <ng-content></ng-content>
  </div>

  @if (showRightButton()) {
    <button class="absolute right-0 tod-scroll-btn hover:tod-scroll-btn py-1 px-4 rounded-full" (click)="scrollRight()">
      <i class="pi pi-chevron-right text-sm"></i>
    </button>
  }
</div>
