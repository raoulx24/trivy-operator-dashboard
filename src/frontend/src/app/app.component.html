<body>
  <main class="container-fluid m-2">
    <!-- sticky: stays on top while the page scrolls; the shadow only shows once content has scrolled underneath -->
    <!-- a widget can ask to hide the bar (NavBarVisibilityService): it leaves the layout (collapsed) and slides out of
         sight (hidden); scrolling up or the mouse at the top edge bring it back as an overlay -->
    <div
      #navHost
      class="tod-sticky-nav"
      [class.tod-sticky-nav-scrolled]="isScrolled()"
      [class.tod-sticky-nav-managed]="navBar.hideRequested()"
      [class.tod-sticky-nav-animate]="navBar.isAtTop()"
      [class.tod-sticky-nav-hidden]="navBar.hidden()"
      [style.height.px]="navBar.hideRequested() ? (navBar.collapsed() ? 0 : barHeight()) : null"
    >
      <app-nav-menu></app-nav-menu>
    </div>
    <div #content class="pt-2">
      <router-outlet></router-outlet>
    </div>
    <!-- the dialogs behind the vulnerability tags of any trivy table -->
    <app-vulnerability-tag-dialogs />
    <p-toast [preventOpenDuplicates]="true" />
  </main>
</body>
