<!-- a vertical scroller fills its parent, so the box has the height (none: it follows the drawing) -->
<div [style.height.px]="viewportHeight()">
<app-scroller class="scroller-host" [class.vertical]="direction() === 'vertical'" [direction]="direction()">
<div #content class="content">
@if (width() > 0 && hasNodes()) {
  @if (captionsOnTop()) {
    <!-- the captions: their own svg, so they stay on top while the nodes scroll under them -->
    <svg class="captions" [attr.width]="drawingWidth()" [attr.height]="labelHeight" aria-hidden="true">
      @for (label of columnLabels(); track $index) {
        <text class="axis-label tod-chart-label tod-chart-label-muted" text-anchor="middle" [attr.x]="label.x" [attr.y]="labelBaseline">
          {{ label.text }}
        </text>
      }
    </svg>
  }
  <svg class="layered-graph" [attr.width]="drawingWidth()" [attr.height]="height()" role="img">
    @if (showColumnLabels() && orientation() === 'rows') {
      <!-- rows: the caption of a layer is at the left, in the middle of it -->
      @for (label of rowLabels(); track $index) {
        <text class="axis-label tod-chart-label tod-chart-label-muted" dominant-baseline="central" x="0" [attr.y]="label.y">
          {{ label.text }}
        </text>
      }
    }
    @for (edge of edgeViews(); track edge.key) {
      <!-- the d of the style moves smoothly where the browser can (the attribute is the fallback) -->
      <path
        class="edge"
        [class.faded]="!edge.active"
        [attr.d]="edge.path"
        [attr.style]="'d: path(&quot;' + edge.path + '&quot;)'"
      />
    }
    @for (node of nodeViews(); track node.id) {
      <!-- the slot is where the node is (it slides when the node moves); the node is drawn at its origin -->
      <g class="node-slot" [style.transform]="'translate(' + node.x + 'px, ' + node.y + 'px)'">
        <g
          class="node-group"
          [class.more]="node.more"
          [class.selectable]="node.selectable"
          [class.selected]="node.selected"
          [class.faded]="!node.active"
          (click)="onNodeClick(node)"
          (mouseenter)="tipShow.emit({ context: node, event: $event })"
          (mousemove)="tipMove.emit($event)"
          (mouseleave)="tipHide.emit()"
        >
          <rect
            class="node"
            [style.fill]="node.color"
            x="0"
            y="0"
            [attr.width]="node.width"
            [attr.height]="nodeHeight()"
            [attr.rx]="nodeRadius"
          />
          <text
            class="node-text tod-chart-label"
            dominant-baseline="central"
            [style.fill]="node.textColor"
            [attr.x]="nodePadding"
            [attr.y]="nodeHeight() / 2"
          >
            {{ node.text }}
          </text>
          @if (node.tagParts.length > 0) {
            <!-- one pill; with several parts, a thin line divides each from the one before it -->
            <rect
              class="node-tag"
              [style.fill]="node.tagFill"
              [style.stroke]="node.textColor"
              [attr.x]="node.tagX"
              [attr.y]="(nodeHeight() - tagHeight()) / 2"
              [attr.width]="node.tagWidth"
              [attr.height]="tagHeight()"
              [attr.rx]="tagHeight() / 2"
            />
            @for (part of node.tagParts; track $index) {
              @if (part.divider !== null) {
                <line
                  class="node-tag-divider"
                  [style.stroke]="node.textColor"
                  [attr.x1]="part.divider"
                  [attr.x2]="part.divider"
                  [attr.y1]="(nodeHeight() - tagHeight()) / 2"
                  [attr.y2]="(nodeHeight() + tagHeight()) / 2"
                />
              }
              <text
                class="node-tag-text tod-chart-label"
                text-anchor="middle"
                dominant-baseline="central"
                [style.fill]="node.textColor"
                [attr.x]="part.x"
                [attr.y]="nodeHeight() / 2"
              >
                {{ part.text }}
              </text>
            }
          }
          @if (node.valueText) {
            <text
              class="node-text node-value tod-chart-label"
              text-anchor="end"
              dominant-baseline="central"
              [style.fill]="node.textColor"
              [attr.x]="node.width - nodePadding"
              [attr.y]="nodeHeight() / 2"
            >
              {{ node.valueText }}
            </text>
          }
          @if (node.selected) {
            <rect
              class="ring"
              x="1"
              y="1"
              [attr.width]="node.width - 2"
              [attr.height]="nodeHeight() - 2"
              [attr.rx]="nodeRadius - 1"
              stroke-width="2"
            />
            <rect
              class="ring-inner"
              x="2.5"
              y="2.5"
              [attr.width]="node.width - 5"
              [attr.height]="nodeHeight() - 5"
              [attr.rx]="nodeRadius - 2.5"
              stroke-width="1"
            />
          }
        </g>
      </g>
    }
  </svg>
}
</div>
</app-scroller>
</div>
