@if (width() > 0) {
  <svg
    class="stacked-bar-chart"
    [style.--grow-time]="grow() + 'ms'"
    [style.--chart-height]="height() + 'px'"
    [attr.width]="width()" [attr.height]="height()" role="img">
    @for (bar of bars(); track bar.index) {
      <g
        class="column"
        [class.has-value]="bar.total > 0"
        [class.clickable]="clickable() && bar.total > 0"
        (click)="onBarClick(bar)"
        (mouseenter)="popover.show(tooltipTemplate() ?? defaultTip, $event, tipContext(bar))"
        (mousemove)="popover.move($event)"
        (mouseleave)="popover.hide()"
      >
        <!-- the slot: the hit area of the column, and the track when it is highlighted -->
        <rect
          class="slot"
          [class.highlighted]="bar.highlighted"
          [attr.x]="bar.x"
          y="0"
          [attr.width]="bar.width"
          [attr.height]="height()"
          [attr.rx]="trackRadius"
        />
        @if (bar.total > 0) {
          <!-- a bar with new data is re-created (a loop of one), so that its growth runs again when the data is received -->
          @for (key of [bar.key]; track key) {
            <g
              class="bar"
              [class.grows]="bar.growDelay !== null"
              [style.--grow-delay]="bar.growDelay !== null ? bar.growDelay + 'ms' : null"
            >
              @for (layer of bar.layers; track layer.series.name) {
                <path [attr.d]="layer.path" [attr.fill]="layer.series.color" />
              }
            </g>
          }
        } @else {
          <rect
            class="dash"
            [attr.x]="bar.x"
            [attr.y]="height() - dashHeight"
            [attr.width]="bar.width"
            [attr.height]="dashHeight"
            [attr.rx]="dashHeight / 2"
          />
        }
      </g>
    }
  </svg>
}

<ng-template #defaultTip let-ctx>
  <div class="tod-text-contrast-color">
    <div class="font-bold">{{ ctx.label }}</div>
    <div>{{ ctx.total }}{{ valueLabel() ? ' ' + valueLabel() : '' }}</div>
    @for (layer of ctx.layers; track layer.series.name) {
      <div class="flex items-center gap-2">
        <span class="tip-swatch" [style.background]="layer.series.color"></span>
        <span class="tod-text-inverted-muted-color">{{ layer.series.name }}</span>
        <span class="ml-auto pl-3">{{ layer.value }}</span>
      </div>
    }
  </div>
</ng-template>
