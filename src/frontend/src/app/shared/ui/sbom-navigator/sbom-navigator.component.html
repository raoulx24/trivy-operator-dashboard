<!-- the table and the graph share, half each, the height the quick info leaves -->
<!-- dataKey and rowExpansionRender go together: trivy-table adds the expander cell per row for the first and the
     expander header for the second -->
<app-trivy-table
  class="block flex-1 basis-0 min-h-0"
  [dataDtos]="rows()"
  [dataKey]="'rowKey'"
  [extraClasses]="'trivy-fill'"
  [rowExpandData]="rowExpand()"
  [rowExpansionRender]="'table'"
  [stateKey]="`${stateKey()} - Neighbours`"
  [trivyTableColumns]="columns"
  (rowActionRequested)="onRowAction($event)"
  (rowExpandDataChange)="onRowExpand($event)"
/>

<app-sbom-quick-info [dto]="hoveredDto()" [index]="index()" />

<app-cytoscape-graph
  class="block flex-1 basis-0 min-h-0"
  [isBreadcrumbVisible]="false"
  [isDeleteEnabled]="false"
  [isFillHeight]="true"
  [layout]="'layered'"
  [nodeDataDtos]="nodeDataDtos()"
  (activeNodeIdChange)="onActiveNodeIdChange($event)"
  (hoveredNodeIdChange)="onHoveredNodeIdChange($event)"
/>
