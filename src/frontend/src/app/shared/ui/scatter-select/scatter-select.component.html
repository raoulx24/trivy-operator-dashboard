@if (width() > 0) {
  <svg
    class="scatter-select"
    [class.selectable]="selectable()"
    [class.drawing]="drawing()"
    [attr.width]="width()"
    [attr.height]="height()"
    [style.--fade-time]="fade() + 'ms'"
    role="img"
    (pointerdown)="onPointerDown($event)"
    (pointermove)="onPointerMove($event)"
    (pointerup)="onPointerUp()"
    (pointercancel)="onPointerCancel()"
  >
    <!-- transparent: the area where a drag starts -->
    <rect
      class="plot-area"
      [attr.x]="plot().left"
      [attr.y]="plot().top"
      [attr.width]="plot().right - plot().left"
      [attr.height]="plot().bottom - plot().top"
    />

    <line class="axis" [attr.x1]="plot().left" [attr.y1]="plot().bottom" [attr.x2]="plot().right" [attr.y2]="plot().bottom" />
    <line class="axis" [attr.x1]="plot().left" [attr.y1]="plot().top" [attr.x2]="plot().left" [attr.y2]="plot().bottom" />

    @if (showTicks()) {
      <!-- a tick is moved by transform: when the scale changes it slides (a new one fades in, a gone one fades out) -->
      @for (tick of xTickMerge().leaving; track tick.value) {
        <g class="tick leaving-tick" [style.transform]="'translate(' + tick.at + 'px,0)'">
          <line class="axis" x1="0" x2="0" [attr.y1]="plot().bottom" [attr.y2]="plot().bottom + 4" />
          <text class="tod-chart-label" text-anchor="middle" x="0" [attr.y]="plot().bottom + 17">{{ tick.text }}</text>
        </g>
      }
      @for (tick of xTicks(); track tick.value) {
        <g class="tick" [class.entering]="xTickMerge().entering.has(tick.value)" [style.transform]="'translate(' + tick.at + 'px,0)'">
          <line class="axis" x1="0" x2="0" [attr.y1]="plot().bottom" [attr.y2]="plot().bottom + 4" />
          <text class="tod-chart-label" text-anchor="middle" x="0" [attr.y]="plot().bottom + 17">{{ tick.text }}</text>
        </g>
      }
      @for (tick of yTickMerge().leaving; track tick.value) {
        <g class="tick leaving-tick" [style.transform]="'translate(0,' + tick.at + 'px)'">
          <line class="axis" [attr.x1]="plot().left - 4" [attr.x2]="plot().left" y1="0" y2="0" />
          <text class="tod-chart-label" text-anchor="end" dominant-baseline="central" [attr.x]="plot().left - 8" y="0">{{ tick.text }}</text>
        </g>
      }
      @for (tick of yTicks(); track tick.value) {
        <g class="tick" [class.entering]="yTickMerge().entering.has(tick.value)" [style.transform]="'translate(0,' + tick.at + 'px)'">
          <line class="axis" [attr.x1]="plot().left - 4" [attr.x2]="plot().left" y1="0" y2="0" />
          <text class="tod-chart-label" text-anchor="end" dominant-baseline="central" [attr.x]="plot().left - 8" y="0">{{ tick.text }}</text>
        </g>
      }
    }

    @if (yAxis().label) {
      <text class="tod-chart-label" x="0" y="12">{{ yAxis().label }}</text>
    }
    @if (xAxis().label) {
      <text class="tod-chart-label" text-anchor="end" [attr.x]="plot().right" [attr.y]="height() - 4">
        {{ xAxis().label }}
      </text>
    }

    @for (path of regionPaths(); track $index) {
      <path class="region" [attr.d]="path" />
    }

    <!-- the points that are gone: they fade out where they were -->
    @for (gone of leavingViews(); track gone.key) {
      <path class="point leaving" [attr.d]="gone.path" [style.fill]="gone.color" [style.transform]="'translate(' + gone.px + 'px,' + gone.py + 'px)'" />
    }

    <!-- a point is the same element while its id is: it moves when its position changes, a new one fades in -->
    @for (view of views(); track view.key) {
      <path
        class="point"
        [class.lit]="view.litDelay !== null"
        [style.--fade-delay]="view.litDelay !== null ? view.litDelay + 'ms' : null"
        [style.transform]="'translate(' + view.px + 'px,' + view.py + 'px)'"
        [attr.data-index]="view.index"
        [class.dimmed]="view.dimmed"
        [attr.d]="view.path"
        [style.fill]="view.color"
        [style.fill-opacity]="view.selected ? 1 : view.dimmed ? null : pointOpacity()"
        (mouseenter)="tipShow.emit({ context: tipContext(view), event: $event })"
        (mousemove)="tipMove.emit($event)"
        (mouseleave)="tipHide.emit()"
      />
      @if (view.centerColor) {
        <!-- the dot in the middle: it follows the point (dimmed with it) and lets the pointer through -->
        <circle
          class="point-center"
          [class.lit]="view.litDelay !== null"
          [style.--fade-delay]="view.litDelay !== null ? view.litDelay + 'ms' : null"
          cx="0"
          cy="0"
          [style.transform]="'translate(' + view.px + 'px,' + view.py + 'px)'"
          [attr.r]="centerRadius()"
          [style.fill]="view.centerColor"
          [style.opacity]="view.dimmed ? 0.18 : 1"
        />
      }
    }

    <!-- the picked point: a contrast border, on top of the others -->
    @if (pickedPath(); as pickedD) {
      <path class="point-picked" [attr.d]="pickedD" />
    }

    @if (draftPath(); as path) {
      <path class="region draft" [attr.d]="path" />
    }
  </svg>
}

@if (legend().length > 0) {
  <div class="legend tod-chart-legend tod-text-muted-color">
    @for (item of legend(); track $index) {
      <span class="legend-item" (mouseenter)="popover.show(item.hint ?? '', $any($event.currentTarget))" (mouseleave)="popover.hide()">
        <svg width="14" height="14" aria-hidden="true">
          <path class="point" [attr.d]="legendPath(item.shape)" [style.fill]="item.color" />
        </svg>
        <span>{{ item.label }}</span>
      </span>
    }
  </div>
}
