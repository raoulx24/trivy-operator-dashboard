<div class="flex items-center gap-2 min-h-8 whitespace-nowrap overflow-hidden">
  @let d = dto();
  @if (d) {
    <span class="font-semibold">{{ d.name }}</span>
    <span>{{ d.version }}</span>
    <p-tag
      [rounded]="true"
      [style]="0 | severityCssStyleById: d.criticalCount"
      [value]="d.criticalCount | vulnerabilityCount"
    />
    <p-tag [rounded]="true" [style]="1 | severityCssStyleById: d.highCount" [value]="d.highCount | vulnerabilityCount" />
    <p-tag
      [rounded]="true"
      [style]="2 | severityCssStyleById: d.mediumCount"
      [value]="d.mediumCount | vulnerabilityCount"
    />
    <p-tag [rounded]="true" [style]="3 | severityCssStyleById: d.lowCount" [value]="d.lowCount | vulnerabilityCount" />
    <p-tag
      [rounded]="true"
      [style]="4 | severityCssStyleById: d.unknownCount"
      [value]="d.unknownCount | vulnerabilityCount"
    />
    <span class="text-xs overflow-hidden text-ellipsis tod-text-muted-color" [title]="d.purl">{{ d.purl }}</span>
  }
</div>
