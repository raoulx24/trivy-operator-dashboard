<div [ngClass]="isFillHeight() ? 'flex flex-col gap-1 h-full' : 'gap-4 flex-col'">
  <app-scroller>
    <div class="flex items-center gap-1 shrink-0 whitespace-nowrap">
      <p-button icon="pi pi-search-plus" label="Zoom In" size="small" raised [text]="true" (onClick)="onZoomIn()" />
      <p-button icon="pi pi-search-minus" label="Zoom Out" size="small" raised [text]="true" (onClick)="onZoomOut()" />
      <p-button icon="pi pi-arrows-alt" label="Fit" size="small" raised [text]="true" (onClick)="onZoomFit()" />
      <p-button
        icon="pi pi-bullseye"
        label="Focus"
        size="small"
        raised
        [text]="true"
        (onClick)="onZoomHighlighted()"
      />
      <div class="h-6 w-[2px] tod-separator mx-1"></div>
      <input
        pInputText
        placeholder="Highlight by name..."
        style="width: 200px; font-size: 12px"
        type="search"
        [formControl]="inputFilterByNameControl"
      />
      @if (!isStatic() && isDeleteEnabled()) {
        <div class="h-6 w-[2px] tod-separator mx-1"></div>
        <p-button
          label="Hide Node"
          size="small"
          class="hidden-sm"
          raised
          [disabled]="graphSelectedNodes.length == 0"
          [text]="true"
          (onClick)="onDeleteNode()"
        >
          <app-icon name="commit" />
        </p-button>
        <p-button
          label="Hide Subtree"
          size="small"
          class="hidden-sm"
          raised
          [disabled]="isStatic() || graphSelectedNodes.length == 0"
          [text]="true"
          (onClick)="onDeleteNodeAndChildren()"
        >
          <app-icon name="graph_2" />
        </p-button>
        <p-button
          label="Undo"
          size="small"
          class="hidden-sm"
          raised
          [disabled]="isStatic() || currentDeletedNodesIndex == -1 || deletedNodes.length == 0"
          [text]="true"
          (onClick)="onUndo()"
        >
          <app-icon name="undo" />
        </p-button>
        <p-button
          label="Redo"
          size="small"
          class="hidden-sm"
          raised
          [disabled]="isStatic() || currentDeletedNodesIndex >= deletedNodes.length - 1"
          [text]="true"
          (onClick)="onRedo()"
        >
          <app-icon name="redo" />
        </p-button>
        <p-button
          label="Show All"
          size="small"
          class="hidden-sm"
          raised
          [disabled]="deletedNodes.length == 0 || this.currentDeletedNodesIndex == -1"
          [text]="true"
          (onClick)="onShowAll()"
        >
          <app-icon name="visibility" />
        </p-button>
      }
      @if (!isStatic()) {
        <div class="h-6 w-[2px] tod-separator mx-1"></div>
        <p-button icon="pi pi-question-circle" size="small" class="hidden-sm" raised [text]="true" (onClick)="onHelp()">
        </p-button>
      }
    </div>
  </app-scroller>
  @if (!isStatic() && isBreadcrumbVisible()) {
    <div class="flex items-center col-span-12 p-0">
      <p-breadcrumb
        class="breadcrumb-no-background breadcrumb-no-overflow pl-2.5 text-xs [&_a]:cursor-pointer"
        [home]="navHome"
        [model]="navItems"
        (onItemClick)="onNavItemClick($event)"
      />
    </div>
  }
  <div class="col-span-12" [ngClass]="{ 'flex-1 min-h-0': isFillHeight() }">
    <div
      #graphContainer
      class="graph-container"
      [class.graph-fill]="isFillHeight()"
      [ngClass]="isFillHeight() ? '' : graphClasses()"
    ></div>
  </div>
</div>

<p-dialog
  closable="true"
  closeOnEscape="true"
  dismissableMask="true"
  resizable="true"
  [breakpoints]="{ '1920px': '1800px', '576px': '90vw' }"
  [header]="'Mini Help'"
  [maximizable]="true"
  [modal]="true"
  [style]="{ width: '1800px', height: '90vh' }"
  [(visible)]="isHelpDialogVisible"
>
  <ng-container #helpContainer></ng-container>
</p-dialog>
