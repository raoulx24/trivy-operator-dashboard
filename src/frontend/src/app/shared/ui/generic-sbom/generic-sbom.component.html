<p-splitter
  #splitter
  (dblclick)="onSplitterDoubleClick($event, splitter)"
  stateStorage="local"
  class="tod-splitter-no-borders tod-no-background tod-sbom-splitter mb-8"
  [layout]="screenSize == 'sm' ? 'vertical' : 'horizontal'"
  [panelSizes]="[35, 65]"
  [stateKey]="screenSize !== 'sm' ? `splitter.${stateKey()}` : undefined"
>
  <ng-template #panel>
    <div class="w-full h-full flex flex-col">
      @if (isImageSelectorVisible()) {
        <!-- the selector gets the images already filtered (it knows nothing of active images); the filter is in a
             popover, its button shows whether it is on (a filled filter) -->
        <!-- items-stretch + h-full: the button is as tall as the selects; size small keeps its own height below theirs,
             otherwise it would set the height of the row -->
        <div class="pb-2 flex items-stretch gap-2">
          <app-paired-options-selector
            class="block flex-1 min-w-0"
            [dataDtos]="selectorImageDtos"
            [(selectedFirstOption)]="selectedNamespace"
            [(selectedUid)]="selectedImageId"
          />
          <p-button
            class="flex tod-select-side-button"
            styleClass="h-full"
            size="small"
            raised
            text
            [ariaLabel]="'Images filter'"
            [icon]="isActiveOnly() ? 'pi pi-filter-fill' : 'pi pi-filter'"
            (onClick)="imagesFilterPopover.toggle($event)"
          />
          <p-popover #imagesFilterPopover appendTo="body">
            <div class="flex flex-col gap-2 text-sm">
              <span class="font-semibold">Images in the selector</span>
              <p-selectbutton
                class="text-sm inline-flex w-fit"
                optionLabel="label"
                optionValue="value"
                size="small"
                [allowEmpty]="false"
                [options]="imagesFilterOptions()"
                [ngModel]="isActiveOnly()"
                (ngModelChange)="setActiveOnly($event)"
              />
              <span class="text-xs tod-text-muted-color">
                Active: the images with a vulnerability report.
                @if (selectedNamespace(); as namespace) {
                  <br />Counted in {{ namespace }}.
                }
              </span>
            </div>
          </p-popover>
        </div>
      }
      <div class="tod-content-border-left tod-content-background overflow-hidden flex-1 min-h-0">
        <app-trivy-table
          [dataDtos]="dependsOnBoms"
          [dataKey]="'bomRef'"
          [extraClasses]="isImageSelectorVisible() ? 'trivy-sbom-list-with-filters' : 'trivy-sbom-list'"
          [isLoading]="isTableLoading()"
          [isRefreshVisible]="true"
          [multiHeaderActions]="multiHeaderActions()"
          [rowExpandData]="rowExpandResponse"
          [rowExpansionRender]="'table'"
          [selectionMode]="'single'"
          [selectedData]="selectedSbomDetail"
          [stateKey]="`${stateKey()} - Depends On`"
          [trivyTableColumns]="dependsOnTableColumns"
          (multiHeaderActionRequested)="onMultiHeaderActionRequested($event)"
          (refreshRequested)="onRefreshRequested()"
          (rowExpandDataChange)="onRowExpandChange($event)"
          (selectedDataChange)="onTableSelectedRowChange($event)"
        />
      </div>
    </div>
  </ng-template>
  <ng-template #panel>
    <!-- the height of the package list on the left; the views share what the breadcrumb bar leaves -->
    <div class="sbom-right w-full flex flex-col tod-content-border-right tod-content-background overflow-hidden px-2 pb-2">
      <div class="flex items-center gap-2">
        <p-breadcrumb
          class="flex-1 min-w-0 breadcrumb-no-background breadcrumb-no-overflow text-xs [&_a]:cursor-pointer"
          [home]="navigation.navHome"
          [model]="navigation.navItems"
          (onItemClick)="onBreadcrumbItemClick($event)"
        />
        <p-selectbutton
          class="tod-select-button-xs inline-flex w-fit"
          optionValue="value"
          size="small"
          [allowEmpty]="false"
          [options]="viewModeOptions"
          [ngModel]="viewMode()"
          (ngModelChange)="setViewMode($event)"
        >
          <ng-template #item let-item>
            <span [attr.aria-label]="item.label" [class]="item.icon" [title]="item.label"></span>
          </ng-template>
        </p-selectbutton>
      </div>

      <!-- both views stay rendered (the graphs keep their state and their size); the hidden one is only made invisible -->
      <div class="tod-sbom-views flex-1 min-h-0">
        <app-sbom-navigator
          class="tod-sbom-view"
          [class.tod-sbom-view-hidden]="viewMode() !== 'navigator'"
          [bomRef]="selectedSbomDetailBomRef"
          [index]="sbomIndex()"
          [levelByBomRef]="levelByBomRef"
          [stateKey]="stateKey()"
          (diveRequested)="onDiveRequested($event)"
          (selectRequested)="onSelectRequested($event)"
        />
        <div
          class="tod-sbom-view flex flex-col gap-1 min-h-0"
          [class.tod-sbom-view-hidden]="viewMode() !== 'graph'"
        >
          <app-sbom-quick-info [dto]="hoveredSbomDetailDto" [index]="sbomIndex()" />
          <app-cytoscape-graph
            class="block flex-1 min-h-0"
            [isBreadcrumbVisible]="false"
            [isFillHeight]="true"
            [nodeDataDtos]="nodeDataDtos"
            [selectedNodeId]="selectedSbomDetailBomRef"
            (activeNodeIdChange)="onActiveNodeIdChange($event)"
            (deletedNodeIdsChange)="onDeletedNodeIds($event)"
            (hoveredNodeIdChange)="onHoveredNodeDtoChange($event)"
            (selectedNodeIdChange)="onNodeIdChange($event)"
            (undeletedNodeIdsChange)="onUndeletedNodeIds($event)"
          />
        </div>
      </div>
    </div>
  </ng-template>
</p-splitter>

@if (fullSbomDataDto() && isTrivyReportsCompareVisible()) {
  <p-dialog
    closable="true"
    closeOnEscape="true"
    dismissableMask="true"
    maximizable="true"
    resizable="true"
    [breakpoints]="{ '890px': '90vw' }"
    [contentStyle]="{ height: '95vh' }"
    [header]="`Compare ${stateKey()}`"
    [modal]="true"
    [style]="{ width: '90vw' }"
    [(visible)]="isTrivyReportsCompareVisible"
  >
    <app-generic-reports-compare
      [comparedTableColumns]="comparedTableColumns"
      [compareExtraClasses]="'trivy-with-filters'"
      [compareIsResetFiltersVisible]="true"
      [compareStateKey]="`${stateKey()} - Compared`"
      [dataDtos]="[]"
      [firstSelectedDto]="compareFirstSelectedDto()"
      [firstSelectedTrivyReportId]="fullSbomDataDto()?.uid"
      [isDependantOnExternalData]="isCompareDependantOnExternalData()"
      [namespacedImageDtos]="namespacedImageDtos"
      [secondSelectedDto]="compareSecondSelectedDto()"
      (firstDtoRequested)="onCompareFirstDtoRequested($event)"
      (secondDtoRequested)="onCompareSecondDtoRequested($event)"
    />
  </p-dialog>
}
