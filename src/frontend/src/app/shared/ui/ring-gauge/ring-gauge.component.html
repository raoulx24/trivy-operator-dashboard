<div
  class="gauge"
  [class.selected]="isSelected()"
  role="button"
  tabindex="0"
  [attr.aria-pressed]="selectable() ? isSelected() : null"
  [attr.aria-label]="data().label + ', ' + centerText()"
  (click)="toggle()"
  (keydown.enter)="toggle()"
  (keydown.space)="toggle(); $event.preventDefault()"
>
  <svg viewBox="0 0 100 100" [attr.width]="size()" [attr.height]="size()" aria-hidden="true">
    <g class="ring-body">
      <circle class="track" cx="50" cy="50" [attr.r]="radius()" [attr.stroke-width]="strokeWidth()" />
      @if (percent() > 0) {
        <!-- an arc with new data is re-created (a loop of one), so that its growth runs again when the data is received -->
        @for (key of [arcKey()]; track key) {
          <circle
            class="arc"
            cx="50"
            cy="50"
            [attr.r]="radius()"
            [attr.stroke-width]="strokeWidth()"
            [attr.stroke]="data().color"
            pathLength="100"
            [class.grows]="animate()"
            [style.--arc-length]="percent()"
            [style.--arc-from]="arcFrom() + 'deg'"
            [style.--grow-time]="animationDuration() + 'ms'"
            [style.--grow-delay]="animationDelay() + 'ms'"
          />
        }
      }
      @for (key of [arcKey()]; track key) {
        <text
          class="center tod-chart-label"
          x="50"
          y="50"
          text-anchor="middle"
          dominant-baseline="central"
          [class.grows]="animate()"
          [style.--grow-time]="animationDuration() + 'ms'"
          [style.--grow-delay]="animationDelay() + 'ms'"
        >
          {{ centerText() }}
        </text>
      }
    </g>
  </svg>
  <span class="legend tod-chart-legend">{{ data().label }}</span>
</div>
