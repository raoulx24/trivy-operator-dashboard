@if (width() > 0) {
  <svg class="meter" [style.--grow-time]="grow() + 'ms'" [attr.width]="width()" [attr.height]="barHeight()" role="meter">
    <defs>
      <!-- the fill is round at its end: all the way when the meter is full, at the last segment when it is not -->
      <clipPath [attr.id]="clipId">
        <rect x="0" y="0" [attr.width]="fillWidth()" [attr.height]="barHeight()" [attr.rx]="barHeight() / 2" />
      </clipPath>
    </defs>

    <rect class="track" x="0" y="0" [attr.width]="width()" [attr.height]="barHeight()" [attr.rx]="barHeight() / 2" />

    <g [attr.clip-path]="'url(#' + clipId + ')'">
      <!-- a segment with new data is re-created, so that its growth runs again when the data is received -->
      @for (bar of bars(); track bar.key; let i = $index) {
        <g
          class="segment"
          [class.grows]="bar.growDelay !== null"
          [style.--grow-delay]="bar.growDelay !== null ? bar.growDelay + 'ms' : null"
          (mouseenter)="tipShow.emit({ context: tipContext(bar, i), event: $event })"
          (mousemove)="tipMove.emit($event)"
          (mouseleave)="tipHide.emit()"
        >
          <rect
            class="segment-fill"
            y="0"
            [attr.x]="bar.x"
            [attr.width]="bar.width"
            [attr.height]="barHeight()"
            [attr.fill]="bar.segment.color"
          />
          @if (bar.showValue) {
            <text
              class="segment-value tod-chart-label"
              [attr.x]="bar.x + bar.width / 2"
              [attr.y]="barHeight() / 2"
              [style.fill]="bar.segment.textColor ?? 'var(--tod-meter-group-text)'"
              text-anchor="middle"
              dominant-baseline="central"
            >
              {{ bar.segment.value }}
            </text>
          }
        </g>
      }
    </g>
  </svg>
}
