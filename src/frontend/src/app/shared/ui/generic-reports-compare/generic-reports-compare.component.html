<div class="grid grid-cols-12 gap-2 pb-2">
  <app-paired-options-selector
    class="col-span-12 xl:col-span-4 lg:col-span-6"
    [dataDtos]="namespacedImageDtos()"
    [secondOptionPlaceholder]="imagePlaceholder()"
    [firstOptionPlaceholder]="namespacePlaceholder()"
    [firstOptionWider]="firstSelectorLonger()"
    [disabled]="isWalkingEnabledInternal()"
    [(selectedUid)]="firstSelectedTrivyReportId"
  />
  <app-paired-options-selector
    class="col-span-12 xl:col-span-4 lg:col-span-6"
    [dataDtos]="namespacedImageDtos()"
    [secondOptionPlaceholder]="imagePlaceholder()"
    [firstOptionPlaceholder]="namespacePlaceholder()"
    [firstOptionWider]="firstSelectorLonger()"
    [disabled]="isWalkingEnabledInternal()"
    [(selectedUid)]="secondSelectedTrivyReportId"
  />
  <div class="col-span-12 xl:col-span-4 lg:col-span-6 flex items-center text-sm gap-4">
    @if (!isWalkingEnabledInternal()) {
      <p-button icon="pi pi-arrow-right-arrow-left"
                raised
                size="small"
                text
                [disabled]="(!firstSelectedTrivyReportId() || !secondSelectedTrivyReportId())"
                label="Swap items"
                (onClick)="swapFirstAndSecond()" />
    } @else {
      <p-button icon="pi pi-arrow-left"
                raised
                size="small"
                text
                [disabled]="!canWalkLeft()"
                label="Walk left"
                (onClick)="walk('left')" />

      <p-button icon="pi pi-arrow-right"
                raised
                size="small"
                text
                [disabled]="!canWalkRight()"
                label="Walk right"
                (onClick)="walk('right')" />


    }
    <p-toggleswitch [ngModel]="showOnlyModified()"
                    (ngModelChange)="showOnlyModified.set($event)"/>
    <span class="text-sm" [ngClass]="showOnlyModified() ? '' : 'text-muted-color'">Only Modified</span>
  </div>
</div>
<div class="tod-content-border">
  <app-trivy-table
    class="row"
    [activeNamespaces]="[]"
    [dataDtos]="trivyReportDetailsCompared()"
    [extraClasses]="compareExtraClasses()"
    [isCollapseAllVisible]="compareIsCollapseAllVisible()"
    [isResetFiltersVisible]="compareIsResetFiltersVisible()"
    [stateKey]="compareStateKey()"
    [trivyTableColumns]="comparedTableColumns()"
  />
</div>
