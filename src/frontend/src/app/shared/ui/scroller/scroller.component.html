<div
  class="relative flex w-full"
  [class.items-center]="!vertical()"
  [class.h-full]="vertical()"
  [class.justify-center]="vertical()"
>
  @if (showStartButton()) {
    <button
      animate.enter="tod-scroll-btn-enter"
      animate.leave="tod-scroll-btn-leave"
      class="absolute tod-scroll-btn hover:tod-scroll-btn py-1 px-4 rounded-full tod-box-shadow"
      [class.left-0]="!vertical()"
      [class.top-0]="vertical()"
      (click)="scrollBackward()"
    >
      <i class="pi text-sm" [class.pi-chevron-left]="!vertical()" [class.pi-chevron-up]="vertical()"></i>
    </button>
  }

  <div
    #scrollContainer
    class="flex tod-scrollbar-hide"
    [class.overflow-x-auto]="!vertical()"
    [class.flex-1]="!vertical()"
    [class.space-x-4]="!vertical()"
    [class.py-2]="!vertical()"
    [class.overflow-y-auto]="vertical()"
    [class.flex-col]="vertical()"
    [class.space-y-4]="vertical()"
    [class.px-2]="vertical()"
    [class.h-full]="vertical()"
    [class.min-h-0]="vertical()"
  >
    <ng-content></ng-content>
  </div>

  @if (showEndButton()) {
    <button
      animate.enter="tod-scroll-btn-enter"
      animate.leave="tod-scroll-btn-leave"
      class="absolute tod-scroll-btn hover:tod-scroll-btn py-1 px-4 rounded-full tod-box-shadow"
      [class.right-0]="!vertical()"
      [class.bottom-0]="vertical()"
      (click)="scrollForward()"
    >
      <i class="pi text-sm" [class.pi-chevron-right]="!vertical()" [class.pi-chevron-down]="vertical()"></i>
    </button>
  }
</div>
