<div class="tod-content-border tod-content-background flex flex-wrap items-center gap-4 p-3">
  <div class="flex items-center gap-2">
    <p-select
      size="small"
      optionLabel="label"
      optionValue="value"
      [options]="windowOptions"
      [ngModel]="windowMode()"
      (ngModelChange)="windowMode.set($event)"
    />
    @if (sinceLabel()) {
      <span class="text-xs tod-text-muted-color">since {{ sinceLabel() }}</span>
    }
  </div>

  <!-- the same select button as the state one of the base os widget: dot (the severity color) and label -->
  <p-selectbutton
    size="small"
    class="text-sm inline-flex w-fit"
    optionLabel="label"
    optionValue="value"
    [multiple]="true"
    [options]="severityOptions"
    [ngModel]="severityIds()"
    (ngModelChange)="onSeverityIdsChange($event)"
  >
    <ng-template #item let-item>
      <span class="inline-flex items-center gap-1.5 px-1">
        <span class="tod-state-dot" [style.background]="item.color"></span>
        {{ item.label }}
      </span>
    </ng-template>
  </p-selectbutton>

  <p-multiselect
    size="small"
    placeholder="All namespaces"
    display="chip"
    class="min-w-60"
    [filter]="true"
    [showClear]="true"
    [maxSelectedLabels]="3"
    [options]="namespaceOptions()"
    [ngModel]="namespaces()"
    (ngModelChange)="namespaces.set($event ?? [])"
  />

  <p-button
    icon="pi pi-refresh"
    label="Refresh"
    size="small"
    class="ml-auto"
    [text]="true"
    [raised]="true"
    (onClick)="refresh.emit()"
  />
</div>
