<div class="tod-content-border tod-content-background flex flex-wrap items-center gap-4 p-3">
  <div class="flex items-center gap-2">
    <p-select
      size="small"
      optionLabel="label"
      optionValue="value"
      [options]="windowOptions"
      [ngModel]="windowMode()"
      (ngModelChange)="windowMode.set($event)"
    />
    @if (sinceLabel()) {
      <span class="text-xs tod-text-muted-color">since {{ sinceLabel() }}</span>
    }
  </div>

  <!-- the severities: a toggle pill each, filled with the color of its severity while it is on (at least one stays on) -->
  <div class="flex flex-wrap items-center gap-1.5" role="group" aria-label="Severities">
    @for (option of severityOptions; track option.value) {
      <app-pill-button
        [label]="option.label"
        [toggle]="true"
        [active]="severityIds().includes(option.value)"
        [dotColor]="option.color"
        [activeColor]="option.color"
        [activeTextColor]="option.textColor"
        (pressed)="toggleSeverity(option.value)"
      />
    }
  </div>

  <p-multiselect
    size="small"
    placeholder="All namespaces"
    display="chip"
    class="min-w-60"
    [filter]="true"
    [showClear]="true"
    [maxSelectedLabels]="3"
    [options]="namespaceOptions()"
    [ngModel]="namespaces()"
    (ngModelChange)="namespaces.set($event ?? [])"
  />

  <p-button
    icon="pi pi-refresh"
    label="Refresh"
    size="small"
    class="ml-auto"
    [text]="true"
    [raised]="true"
    (onClick)="refresh.emit()"
  />
</div>
