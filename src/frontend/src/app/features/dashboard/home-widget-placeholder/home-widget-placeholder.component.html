<app-home-widget-frame
  [heading]="heading()"
  [hint]="hint()"
  [state]="state()"
  [canExpand]="canExpand()"
  [expanded]="isExpanded()"
  (expandToggle)="toggleExpand()"
>
  @if (searchPlaceholder()) {
    <input
      type="text"
      class="p-inputtext p-inputtext-sm w-full"
      [placeholder]="searchPlaceholder()"
      [value]="query()"
      (input)="query.set($any($event.target).value)"
      (keydown.enter)="onSearch()"
    />
  }

  <div class="home-placeholder-body flex-1 text-sm p-2">
    Here it should be: {{ description() }}
  </div>

  <!-- a real control for the widget, shown between the explanation and the source -->
  <ng-content />

  <div class="text-xs font-mono tod-text-muted-color">{{ source() }}</div>
</app-home-widget-frame>
