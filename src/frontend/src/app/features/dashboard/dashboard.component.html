<div class="flex flex-col gap-4 p-1">
  <app-home-filter-bar
    [namespaceOptions]="namespaceOptions()"
    [sinceLabel]="sinceLabel()"
    [hasPreviousVisit]="lastVisitUtc !== undefined"
    [(windowMode)]="windowMode"
    [(severityIds)]="severityIds"
    [(namespaces)]="namespaces"
    [(activeImagesOnly)]="activeImagesOnly"
    (refresh)="onRefresh()"
  />

  <div appHomeWidgetGroup class="grid grid-cols-1 lg:grid-cols-2 gap-4">
  <app-home-since-last-visit
    [hint]="sinceLastVisitHint()"
    [namespaces]="namespaces()"
    [severities]="severityIds()"
    [today]="todayUtc"
    [visitDays]="visitDays"
    [lastVisitDay]="lastVisitDay"
    [drift]="driftDays()"
    [images]="newImagesDays()"
    [refresh]="refreshCounter()"
    (laneClicked)="onSinceLastVisitClick($event)"
    (sourcesRefreshRequested)="onSinceLastVisitRefresh()"
  />

  <app-home-data-health [refresh]="refreshCounter()" />
  </div>

  <div appHomeWidgetGroup class="grid grid-cols-1 lg:grid-cols-2 2xl:grid-cols-4 gap-4">
    <app-home-where-is-vulnerability [hint]="searchHint()" [namespaces]="namespaces()" />
    <app-home-where-is-package [hint]="searchHint()" [namespaces]="namespaces()" />
    <app-home-where-is-check [hint]="searchHint()" [namespaces]="namespaces()" />
    <app-home-where-is-license [hint]="searchHint()" [namespaces]="namespaces()" />
  </div>

  <div appHomeWidgetGroup class="grid grid-cols-1 lg:grid-cols-2 2xl:grid-cols-4 gap-4">
    <app-home-new-vulnerabilities
      #newVulnerabilities
      [hint]="changesHint()"
      [since]="since()"
      [severities]="severityIds()"
      [namespaces]="namespaces()"
      [refresh]="refreshCounter()"
    />
    <app-home-new-fixes
      #newFixes
      [hint]="changesHint()"
      [since]="since()"
      [severities]="severityIds()"
      [namespaces]="namespaces()"
      [refresh]="refreshCounter()"
    />
    <app-home-known-exploited
      #knownExploited
      [hint]="knownExploitedHint()"
      [since]="since()"
      [namespaces]="namespaces()"
      [refresh]="refreshCounter()"
    />
    <app-home-exposed-secrets
      [hint]="exposedSecretsHint()"
      [namespaces]="namespaces()"
      [refresh]="refreshCounter()"
    />
  </div>

  <div appHomeWidgetGroup class="grid grid-cols-1 lg:grid-cols-3 gap-4">
    <app-home-history-drift
      (daysChanged)="driftDays.set($event)"
      #historyDrift
      [hint]="historyDriftHint()"
      [namespaces]="namespaces()"
      [severities]="severityIds()"
      [activeImagesOnly]="activeImagesOnly()"
      [today]="todayUtc"
      [visitDays]="visitDays"
      [refresh]="refreshCounter()"
    />
    <app-home-new-images
      (daysChanged)="newImagesDays.set($event)"
      #newImages
      [hint]="newImagesHint()"
      [namespaces]="namespaces()"
      [severities]="severityIds()"
      [today]="todayUtc"
      [visitDays]="visitDays"
      [refresh]="refreshCounter()"
    />
    <app-home-base-os
      [hint]="baseOsHint()"
      [namespaces]="namespaces()"
      [today]="todayUtc"
      [refresh]="refreshCounter()"
    />
  </div>

  <div appHomeWidgetGroup class="grid grid-cols-1 lg:grid-cols-3 gap-4">
    <app-home-fix-waiting
      [hint]="stateHint()"
      [severities]="severityIds()"
      [namespaces]="namespaces()"
      [refresh]="refreshCounter()"
    />
    <app-home-failing-checks
      [hint]="stateHint()"
      [severities]="severityIds()"
      [namespaces]="namespaces()"
      [refresh]="refreshCounter()"
    />
    <app-home-oldest-images
      [hint]="oldestImagesHint()"
      [severities]="severityIds()"
      [namespaces]="namespaces()"
      [refresh]="refreshCounter()"
    />
  </div>

  <div appHomeWidgetGroup class="grid grid-cols-1 lg:grid-cols-3 gap-4">
    <app-home-compliance hint="cluster, not filtered" [refresh]="refreshCounter()" />
    <app-home-package-hotspots
      [hint]="stateHint()"
      [severities]="severityIds()"
      [namespaces]="namespaces()"
      [refresh]="refreshCounter()"
    />
    <app-home-reach-epss
      [hint]="stateHint()"
      [severities]="severityIds()"
      [namespaces]="namespaces()"
      [refresh]="refreshCounter()"
    />
  </div>

</div>
