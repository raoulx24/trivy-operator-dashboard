<div class="flex flex-col gap-4 p-1">
  <app-home-filter-bar
    [namespaceOptions]="namespaceOptions()"
    [sinceLabel]="sinceLabel()"
    [(windowMode)]="windowMode"
    [(severityIds)]="severityIds"
    [(namespaces)]="namespaces"
    (refresh)="onRefresh()"
  />

  <app-home-widget-placeholder
    heading="Data health"
    hint="not filtered"
    description="watchers ok / with issues, per report kind the count and the oldest / newest scan, the last fetch of KEV / EPSS / EUVD / EOL, the start of the history and of the fix tracking (could become status chips in the filter bar)"
    source="GET api/home/data-health → HomeDataHealthDto"
    [state]="dataHealth()"
  />

  <div appHomeWidgetGroup class="grid grid-cols-1 lg:grid-cols-2 2xl:grid-cols-4 gap-4">
    <app-home-widget-placeholder
      heading="Where is… vulnerability"
      [hint]="searchHint()"
      description="a vulnerability id (CVE, GHSA, distro advisories...), prefix: per id the packages (installed versions, fixed version), images, namespaces, workloads, severity, KEV / EPSS"
      searchPlaceholder="CVE-2024-3094, GHSA-..."
      source="GET api/home/where-is/vulnerability → HomeWhereIsVulnerabilityDto"
      [state]="whereIsVulnerability()"
      (search)="onFindVulnerability($event)"
    />
    <app-home-widget-placeholder
      heading="Where is… package"
      [hint]="searchHint()"
      description="a package: name substring, or purl prefix (pkg:..., with @version prefix); per package (purl without version) the licenses and, per version, images, namespaces and its vulnerabilities"
      searchPlaceholder="openssl or pkg:npm/axios@1.6"
      source="GET api/home/where-is/package → HomeWhereIsPackageDto"
      [state]="whereIsPackage()"
      (search)="onFindPackage($event)"
    />
    <app-home-widget-placeholder
      heading="Where is… check"
      [hint]="searchHint()"
      description="a security assessment check (config audit, RBAC, infra) by id (KSV014 = AVD-KSV-0014) or title: severity, remediation, failing resources, namespaces"
      searchPlaceholder="KSV014 or a title, e.g. root"
      source="GET api/home/where-is/check → HomeWhereIsCheckDto"
      [state]="whereIsCheck()"
      (search)="onFindCheck($event)"
    />
    <app-home-widget-placeholder
      heading="Where is… license"
      [hint]="searchHint()"
      description="a license (SPDX id or name substring): per license the packages (purl without version) with it, their versions, images and namespaces; needs SBOM reports"
      searchPlaceholder="MIT, GPL-3.0"
      source="GET api/home/where-is/license → HomeWhereIsLicenseDto"
      [state]="whereIsLicense()"
      (search)="onFindLicense($event)"
    />
  </div>

  <div appHomeWidgetGroup class="grid grid-cols-1 lg:grid-cols-3 gap-4">
    <app-home-widget-placeholder
      heading="New active vulnerabilities"
      [hint]="changesHint()"
      description="(vulnerability id, package) first seen in the window: totals (ids, rows, images, namespaces) and the top rows by reach, with KEV / EPSS markers; rows that existed before the fix tracking started are never new"
      source="GET api/home/new-vulnerabilities → HomeNewVulnerabilitiesDto"
      [state]="newVulnerabilities()"
    />
    <app-home-widget-placeholder
      heading="Fixes now available"
      [hint]="changesHint()"
      description="(vulnerability id, package) whose fix appeared in the window (not the ones that came with their fix): fixed version, images, namespaces"
      source="GET api/home/new-fixes → HomeNewFixesDto"
      [state]="newFixes()"
    />
    <app-home-widget-placeholder
      heading="Known exploited"
      [hint]="knownExploitedHint()"
      description="KEV / EUVD vulnerabilities running now, one per id; the ones exploited in the window marked as new; ransomware flag, fix, reach"
      source="GET api/home/known-exploited → HomeKnownExploitedDto"
      [state]="knownExploited()"
    />
  </div>

  <div appHomeWidgetGroup class="grid grid-cols-1 lg:grid-cols-3 gap-4">
    <app-home-widget-placeholder
      heading="History drift"
      [hint]="historyDriftHint()"
      description="per UTC day, the distinct (vulnerability id, severity) pairs added to images that were already running (from the history deltas, added only), still active now; known exploited ones counted apart and flagged; complete only within the history retention"
      source="GET api/home/history-drift → HomeHistoryDriftDto"
      [state]="historyDrift()"
    >
      <app-activity-heatmap
        [data]="historyDriftChart().data"
        [from]="historyDriftChart().from"
        [to]="todayUtc"
        [emphasis1Days]="visitDays"
        [emphasis2Days]="historyDriftChart().flaggedDays"
        valueLabel="added (id, severity) pairs"
        emphasis1Label="you opened the home page"
        emphasis2Label="known exploited added"
      />
    </app-home-widget-placeholder>
    <app-home-widget-placeholder
      heading="New images"
      [hint]="newImagesHint()"
      description="per UTC day, the running images first seen that day and their distinct (vulnerability id, severity) pairs as they are now (current state, not as they arrived); known exploited counted apart"
      source="GET api/home/new-images → HomeNewImagesDto"
      [state]="newImages()"
    >
      <app-activity-heatmap
        [data]="newImagesChart().data"
        [from]="newImagesChart().from"
        [to]="todayUtc"
        [emphasis1Days]="visitDays"
        [emphasis2Days]="newImagesChart().flaggedDays"
        valueLabel="new images"
        emphasis1Label="you opened the home page"
        emphasis2Label="known exploited among them"
      />
    </app-home-widget-placeholder>
    <app-home-base-os
      [hint]="baseOsHint()"
      [namespaces]="namespaces()"
      [today]="todayUtc"
      [refresh]="refreshCounter()"
    />
  </div>

  <div appHomeWidgetGroup class="grid grid-cols-1 lg:grid-cols-3 gap-4">
    <app-home-widget-placeholder
      heading="Fix waiting time"
      [hint]="stateHint()"
      description="fixable (vulnerability id, package) sorted by how long the fix is known (a lower bound), with reach"
      source="GET api/home/fix-waiting → HomeFixWaitingDto"
      [state]="fixWaiting()"
    />
    <app-home-widget-placeholder
      heading="Failing checks"
      [hint]="stateHint()"
      description="failing config audit / RBAC / infra checks grouped by check id: title, severity, resources, namespaces"
      source="GET api/home/failing-checks → HomeFailingChecksDto"
      [state]="failingChecks()"
    />
    <app-home-widget-placeholder
      heading="Oldest running images"
      [hint]="oldestImagesHint()"
      description="running digests by the moment they were first seen by the history: repo:tag, workloads, namespaces, vulnerability ids"
      source="GET api/home/oldest-images → HomeOldestImagesDto"
      [state]="oldestImages()"
    />
  </div>

  <div appHomeWidgetGroup class="grid grid-cols-1 lg:grid-cols-2 gap-4">
    <app-home-package-hotspots
      [hint]="stateHint()"
      [severities]="severityIds()"
      [namespaces]="namespaces()"
      [refresh]="refreshCounter()"
    />
    <app-home-widget-placeholder
      heading="Reach vs EPSS"
      [hint]="stateHint()"
      description="per vulnerability id: images (x) against the EPSS percentile (y), known exploited marked"
      source="GET api/home/reach-epss → HomeReachEpssDto"
      [state]="reachEpss()"
    />
  </div>
</div>
