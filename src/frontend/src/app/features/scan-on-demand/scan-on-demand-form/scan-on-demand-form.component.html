<app-trivy-box [hasBackground]="true">
  <form class="flex flex-col gap-1" (ngSubmit)="onSubmit()">
    <div class="flex flex-wrap items-end gap-3">
      <div class="flex flex-col gap-1 flex-1 min-w-[16rem]">
        <label class="text-xs tod-text-muted-color" for="sod-image">What to scan</label>
        <input
          pInputText
          id="sod-image"
          name="image"
          placeholder="registry/repository:tag or @sha256:..."
          [(ngModel)]="image"
          (ngModelChange)="onInputChange()"
          aria-label="Image to scan"
        />
      </div>
      <div class="flex flex-col gap-1">
        <span class="text-xs tod-text-muted-color">What to collect</span>
        <p-selectbutton
          class="inline-flex w-fit"
          name="types"
          optionLabel="label"
          optionValue="value"
          size="small"
          [allowEmpty]="false"
          [multiple]="true"
          [options]="typeOptions()"
          [(ngModel)]="selectedTypes"
          (ngModelChange)="onInputChange()"
        />
      </div>
      <p-button
        class="tod-neutral-button"
        icon="pi pi-play"
        label="Scan"
        raised
        text
        size="small"
        type="submit"
        [loading]="isSubmitting()"
      />
    </div>
    @if (localError() ?? serverError(); as error) {
      <small class="tod-text-danger-color">{{ error }}</small>
    }
  </form>
</app-trivy-box>
