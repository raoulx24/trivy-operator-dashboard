<div class="flex flex-col gap-1 h-full pr-1">
  <p-button
    class="pb-1"
    icon="pi pi-angle-double-right"
    label="All scans"
    size="small"
    styleClass="w-full"
    [text]="true"
    (onClick)="expandRequested.emit()"
  />
  <div class="flex flex-col gap-0.5 overflow-y-auto">
    @for (scan of scans(); track scan.id) {
      <button
        type="button"
        class="tod-sod-rail-item"
        [class.tod-sod-rail-item-selected]="scan.id === selectedScanId()"
        [class.tod-sod-rail-item-disabled]="scan.state !== 'Completed'"
        [pTooltip]="scan.image + ' - ' + scan.state"
        tooltipPosition="right"
        (click)="onClick(scan)"
      >
        <span class="tod-state-dot" [style.background]="stateColor(scan.state)"></span>
        <span class="overflow-hidden text-ellipsis whitespace-nowrap">{{ shortName(scan.image) }}</span>
      </button>
    }
  </div>
</div>
